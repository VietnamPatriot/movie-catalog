<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Browse 20 films from IMDb and 20 top-rated anime from MyAnimeList.">
  <title>Film &amp; Anime Catalog</title>
  <style>
    :root {
      color-scheme: dark;
      font: 100%/1.5 system-ui, sans-serif;
      background: #10131a;
      color: #f3f4f8;
      --panel: #171b25;
      --line: #303644;
      --muted: #aeb7ca;
      --accent: #c2b7ff;
    }

    * { box-sizing: border-box; }
    body { margin: 0; }
    main { width: min(100% - 2rem, 68rem); margin: 0 auto; }
    header { padding: clamp(2.5rem, 7vw, 5rem) 0 2rem; }
    h1 { margin: 0; font-size: clamp(2.25rem, 6vw, 4rem); line-height: 1.06; letter-spacing: -.055em; }
    header p { margin: .9rem 0 0; color: var(--muted); }
    a { color: var(--accent); text-underline-offset: .2em; }
    a:hover { color: #e5dfff; }
    button, input, select { font: inherit; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

    .catalog {
      border: 1px solid var(--line);
      border-radius: 1rem;
      background: var(--panel);
    }

    .controls {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(8.5rem, auto) minmax(10rem, auto);
      gap: 1rem;
      padding: 1.25rem 1.5rem 0;
    }

    label { display: grid; gap: .35rem; font-size: .875rem; font-weight: 650; }
    input, select {
      width: 100%;
      min-height: 2.75rem;
      padding: .5rem .75rem;
      border: 1px solid var(--line);
      border-radius: .5rem;
      background: #10131a;
      color: inherit;
      font-weight: 400;
    }

    input::placeholder { color: var(--muted); }
    select {
      appearance: none;
      padding-right: 2rem;
      background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
      background-position: calc(100% - 1rem) 50%, calc(100% - .7rem) 50%;
      background-size: .3rem .3rem;
      background-repeat: no-repeat;
    }

    #result-count { margin: .85rem 1.5rem; color: var(--muted); font-size: .875rem; }
    table { width: 100%; border-collapse: collapse; }
    thead { background: #1f2430; }
    th, td { padding: .8rem .75rem; text-align: left; }
    thead th { font-size: .875rem; color: var(--muted); }
    tbody tr { border-top: 1px solid var(--line); }
    tbody tr:hover { background: #1a202c; }
    th:first-child, td:first-child { padding-left: 1.5rem; }
    th:last-child, td:last-child { padding-right: 1.5rem; text-align: right; }
    tbody th { font-weight: 620; }
    tbody a { color: inherit; text-decoration: none; }
    tbody a:hover { text-decoration: underline; }
    .year, .rank, .format { color: var(--muted); }
    .rank, .year, .score { font-variant-numeric: tabular-nums; }
    .score { color: var(--accent); font-weight: 700; white-space: nowrap; }
    .category { display: block; color: var(--muted); font-size: .875rem; font-weight: 400; }
    #empty { margin: 0; padding: 2rem 1.5rem; border-top: 1px solid var(--line); }
    footer { padding: 1.15rem 0 2.5rem; color: var(--muted); font-size: .875rem; }

    @media (max-width: 38rem) {
      .controls { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); padding-inline: .85rem; gap: .75rem; }
      .controls label:first-child { grid-column: 1 / -1; }
      #result-count { margin-inline: .85rem; }
      tr > :nth-child(3) { display: none; }
      th, td { padding-inline: .4rem; }
      th:first-child, td:first-child { padding-left: .85rem; }
      th:last-child, td:last-child { padding-right: .85rem; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Film &amp; Anime Catalog</h1>
      <p>20 films from IMDb and 20 top-rated anime from MyAnimeList.</p>
    </header>

    <section class="catalog" aria-label="Browse the catalog">
      <div class="controls">
        <label>Search
          <input id="search" type="search" placeholder="Try Gintama or 1994" autocomplete="off">
        </label>
        <label>Category
          <select id="category">
            <option value="">All titles</option>
            <option value="Film">Films</option>
            <option value="Anime">Anime</option>
          </select>
        </label>
        <label>Sort by
          <select id="sort">
            <option value="chart">Chart order</option>
            <option value="score">Highest score</option>
            <option value="year">Newest first</option>
            <option value="title">Title A–Z</option>
          </select>
        </label>
      </div>
      <p id="result-count" role="status"></p>
      <noscript><p>Enable JavaScript to browse the catalog.</p></noscript>
      <table aria-label="Film and anime chart entries">
        <thead>
          <tr>
            <th scope="col">Rank</th>
            <th scope="col">Title</th>
            <th scope="col">Format</th>
            <th scope="col">Year</th>
            <th scope="col">Score</th>
          </tr>
        </thead>
        <tbody id="results"></tbody>
      </table>
      <p id="empty" hidden>No titles match your search.</p>
    </section>

    <footer>
      Source charts: <a href="https://www.imdb.com/chart/top/">IMDb</a> and
      <a href="https://myanimelist.net/topanime.php">MyAnimeList</a>.
      Ranks and scores reflect the November 2026 snapshot.
    </footer>
  </main>

  <template id="title-row">
    <tr>

      <th scope="row"><a></a><span class="category"></span></th>
      <td class="format"></td>
      <td class="year"></td>
      <td class="score"></td>
    </tr>
  </template>

  <script>
    const titles = JSON.parse(document.getElementById('catalog-data').textContent);
    const search = document.getElementById('search');
    const category = document.getElementById('category');
    const sort = document.getElementById('sort');
    const results = document.getElementById('results');
    const resultCount = document.getElementById('result-count');
    const empty = document.getElementById('empty');
    const template = document.getElementById('title-row');
    const sortable = {
      score: (first, second) => second.score - first.score,
      year: (first, second) => second.year - first.year,
      title: (first, second) => first.title.localeCompare(second.title)
    };

    function normalize(value) {
      return value.toLowerCase().normalize('NFD').replace(/\p{Diacritic}/gu, '');
    }

    function renderCatalog() {
      const terms = normalize(search.value).trim().split(/\s+/);
      const visibleTitles = titles.filter(entry => {
        const searchable = normalize([entry.title, entry.alternateTitle, entry.year].join(' '));
        return (!category.value || entry.category === category.value) &&
          terms.every(term => searchable.includes(term));
      });

      if (sort.value !== 'chart') visibleTitles.sort(sortable[sort.value]);

      const rows = visibleTitles.map(entry => {
        const row = template.content.firstElementChild.cloneNode(true);
        const film = entry.category === 'Film';
        const link = row.querySelector('a');
        link.textContent = entry.title;
        link.href = film
          ? 'https://www.imdb.com/title/' + entry.sourceId + '/'
          : 'https://myanimelist.net/anime/' + entry.sourceId;
        row.querySelector('.category').textContent = film ? 'Film · IMDb' : 'Anime · MyAnimeList';
        row.querySelector('.rank').textContent = entry.rank;
        row.querySelector('.format').textContent = entry.format;
        row.querySelector('.year').textContent = entry.year;
        row.querySelector('.score').textContent = entry.score.toFixed(film ? 1 : 2);
        return row;
      });

      results.replaceChildren(...rows);
      resultCount.textContent = visibleTitles.length + (visibleTitles.length === 1 ? ' title' : ' titles');
      empty.hidden = visibleTitles.length > 0;
    }

    search.addEventListener('input', renderCatalog);
    category.addEventListener('change', renderCatalog);
    sort.addEventListener('change', renderCatalog);
    renderCatalog();
  </script>
